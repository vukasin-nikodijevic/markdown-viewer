<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MD Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-fg: #1f2328;
  --color-fg-muted: #656d76;
  --color-bg: #ffffff;
  --color-bg-subtle: #f6f8fa;
  --color-border: #d1d9e0;
  --color-border-active: #fd8c73;
  --color-link: #0969da;
  --color-code-bg: #eff1f3;
  --color-tab-hover: #eaeef2;
}

[data-theme="dark"] {
  --color-fg: #e6edf3;
  --color-fg-muted: #9198a1;
  --color-bg: #0d1117;
  --color-bg-subtle: #161b22;
  --color-border: #30363d;
  --color-border-active: #f78166;
  --color-link: #4493f8;
  --color-code-bg: #282e33;
  --color-tab-hover: #1c2128;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  font-size: 16px;
  line-height: 1.5;
  color: var(--color-fg);
  background-color: var(--color-bg);
  transition: color 0.15s, background-color 0.15s;
}

/* Toolbar (right side of tab bar) */
.toolbar {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-left: auto;
  padding: 0 8px;
  flex-shrink: 0;
}
.toolbar button {
  background: none;
  border: none;
  color: var(--color-fg-muted);
  cursor: pointer;
  font-size: 19.5px;
  width: 36px;
  height: 36px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.toolbar button:hover { background: var(--color-tab-hover); color: var(--color-fg); }
.toolbar .zoom-label {
  font-size: 14px;
  color: var(--color-fg-muted);
  min-width: 42px;
  text-align: center;
  user-select: none;
}

/* Tab bar */
.tab-bar {
  display: flex;
  background: var(--color-bg-subtle);
  border-bottom: 1px solid var(--color-border);
  overflow-x: auto;
  position: sticky;
  top: 0;
  z-index: 100;
  min-height: 50px;
}
.tab-bar::-webkit-scrollbar { height: 2px; }
.tab-bar::-webkit-scrollbar-thumb { background: var(--color-border); }

.tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  font-size: 17px;
  color: var(--color-fg-muted);
  cursor: pointer;
  border-right: 1px solid var(--color-border);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  user-select: none;
  transition: background 0.1s;
}
.tab:hover { background: var(--color-tab-hover); }
.tab.active {
  color: var(--color-fg);
  background: var(--color-bg);
  border-bottom-color: var(--color-border-active);
}

.tab-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  font-size: 18px;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.1s;
}
.tab:hover .tab-close, .tab.active .tab-close { opacity: 0.5; }
.tab-close:hover { opacity: 1 !important; background: var(--color-border); }

/* Tab panels */
.tab-panel { display: none; padding: 32px; }
.tab-panel.active { display: block; }

/* GitHub Flavored Markdown */
.markdown-body {
  max-width: 980px;
  margin: 0 auto;
  padding: 0 16px;
  word-wrap: break-word;
}

.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  margin-top: 24px;
  margin-bottom: 16px;
  font-weight: 600;
  line-height: 1.25;
  scroll-margin-top: 56px;
}
.markdown-body h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
.markdown-body h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
.markdown-body h3 { font-size: 1.25em; }
.markdown-body h4 { font-size: 1em; }
.markdown-body h5 { font-size: 0.875em; }
.markdown-body h6 { font-size: 0.85em; color: var(--color-fg-muted); }

.markdown-body p { margin-top: 0; margin-bottom: 16px; }
.markdown-body a { color: var(--color-link); text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body strong { font-weight: 600; }

.markdown-body ul, .markdown-body ol { padding-left: 2em; margin-top: 0; margin-bottom: 16px; }
.markdown-body li { margin-top: 0.25em; }

.markdown-body input[type="checkbox"] {
  margin: 0 0.35em 0.25em -1.4em;
  vertical-align: middle;
}

.markdown-body code {
  padding: 0.2em 0.4em;
  font-size: 85%;
  white-space: break-spaces;
  background-color: var(--color-code-bg);
  border-radius: 6px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
.markdown-body pre {
  padding: 16px;
  overflow: auto;
  font-size: 85%;
  line-height: 1.45;
  color: var(--color-fg);
  background-color: var(--color-bg-subtle);
  border-radius: 6px;
  margin-top: 0;
  margin-bottom: 16px;
}
.markdown-body pre code {
  display: inline;
  padding: 0;
  overflow: visible;
  line-height: inherit;
  word-wrap: normal;
  background-color: transparent;
  border: 0;
  font-size: 100%;
  white-space: pre;
}

.markdown-body blockquote {
  margin: 0 0 16px 0;
  padding: 0 1em;
  color: var(--color-fg-muted);
  border-left: 0.25em solid var(--color-border);
}

.markdown-body table {
  border-spacing: 0;
  border-collapse: collapse;
  margin-top: 0;
  margin-bottom: 16px;
  display: block;
  width: max-content;
  max-width: 100%;
  overflow: auto;
}
.markdown-body table th, .markdown-body table td {
  padding: 6px 13px;
  border: 1px solid var(--color-border);
}
.markdown-body table th { font-weight: 600; background-color: var(--color-bg-subtle); }
.markdown-body table tr:nth-child(2n) { background-color: var(--color-bg-subtle); }

.markdown-body hr {
  height: 0.25em;
  padding: 0;
  margin: 24px 0;
  background-color: var(--color-border);
  border: 0;
}

.markdown-body img { max-width: 100%; border-radius: 6px; }
.markdown-body del { color: var(--color-fg-muted); }

/* Search bar */
.search-bar {
  display: none;
  position: fixed;
  top: 58px;
  right: 16px;
  z-index: 200;
  background: var(--color-bg-subtle);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  padding: 6px 8px;
  gap: 6px;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.search-bar.visible { display: flex; }
.search-bar input {
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  color: var(--color-fg);
  font-size: 13px;
  padding: 4px 8px;
  width: 220px;
  outline: none;
  font-family: inherit;
}
.search-bar input:focus { border-color: var(--color-link); }
.search-bar .search-count {
  font-size: 12px;
  color: var(--color-fg-muted);
  min-width: 50px;
  text-align: center;
  user-select: none;
}
.search-bar button {
  background: none;
  border: none;
  color: var(--color-fg-muted);
  cursor: pointer;
  font-size: 14px;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.search-bar button:hover { background: var(--color-tab-hover); color: var(--color-fg); }

/* Quick index popup (Ctrl+Shift+A) */
.quick-index {
  display: none;
  position: fixed;
  top: 10vh;
  left: 50%;
  transform: translateX(-50%);
  width: 560px;
  max-width: 90vw;
  max-height: 60vh;
  z-index: 300;
  background: var(--color-bg-subtle);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  flex-direction: column;
  overflow: hidden;
}
.quick-index.visible { display: flex; }
.quick-index input {
  background: var(--color-bg);
  border: none;
  border-bottom: 1px solid var(--color-border);
  color: var(--color-fg);
  font-size: 15px;
  padding: 10px 12px;
  outline: none;
  font-family: inherit;
}
.qi-list { overflow-y: auto; flex: 1; }
.qi-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  font-size: 14px;
  color: var(--color-fg);
  cursor: pointer;
  user-select: none;
}
.qi-item .qi-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.qi-item .qi-badge {
  flex-shrink: 0;
  font-size: 11px;
  color: var(--color-fg-muted);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 1px 6px;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.qi-item.selected { background: var(--color-tab-hover); }
.qi-empty {
  padding: 12px;
  font-size: 13px;
  color: var(--color-fg-muted);
  text-align: center;
}
.qi-footer {
  border-top: 1px solid var(--color-border);
  padding: 5px 10px;
  font-size: 11px;
  color: var(--color-fg-muted);
  user-select: none;
}
@keyframes qi-flash {
  0% { background-color: rgba(255, 200, 0, 0.35); }
  100% { background-color: transparent; }
}
.qi-flash { animation: qi-flash 1.2s ease-out 1; }

mark.search-highlight { background: rgba(255, 200, 0, 0.4); color: inherit; border-radius: 2px; }
mark.search-highlight.current { background: rgba(255, 140, 0, 0.7); }
</style>
</head>
<body>
<div class="tab-bar" id="tabBar">
  <div class="toolbar">
    <button onclick="zoomOut()" title="Zoom out (Ctrl+-)">&#x2212;</button>
    <span class="zoom-label" id="zoomLabel">180%</span>
    <button onclick="zoomIn()" title="Zoom in (Ctrl++)">&#x2b;</button>
    <button onclick="zoomReset()" title="Reset zoom (Ctrl+0)">&#x21ba;</button>
    <button onclick="toggleTheme()" id="themeBtn" title="Toggle theme (Ctrl+Shift+L)">&#x263e;</button>
  </div>
</div>
<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="Search…" autocomplete="off" spellcheck="false">
  <span class="search-count" id="searchCount"></span>
  <button onclick="searchPrev()" title="Previous (Shift+F3)">▲</button>
  <button onclick="searchNext()" title="Next (F3)">▼</button>
  <button onclick="closeSearch()" title="Close (Esc)">×</button>
</div>
<div class="quick-index" id="quickIndex">
  <input type="text" id="quickIndexInput" placeholder="Search index — tabs & headings…" autocomplete="off" spellcheck="false">
  <div class="qi-list" id="quickIndexList"></div>
  <div class="qi-footer">&uarr;/&darr; navigate &middot; Enter open &middot; Esc close</div>
</div>
<div id="tabPanels"></div>
<script>
let activeTabId = null;

function addTab(id, title, html) {
  const bar = document.getElementById('tabBar');
  const panels = document.getElementById('tabPanels');
  const toolbar = document.querySelector('.toolbar');

  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.id = id;
  tab.onclick = function() { switchTab(id); };
  tab.onauxclick = function(e) { if (e.button === 1) { e.preventDefault(); closeTab(id); } };

  const titleSpan = document.createElement('span');
  titleSpan.className = 'tab-title';
  titleSpan.textContent = title;
  tab.appendChild(titleSpan);

  const close = document.createElement('span');
  close.className = 'tab-close';
  close.textContent = '\u00d7';
  close.onclick = function(e) { e.stopPropagation(); closeTab(id); };
  tab.appendChild(close);

  bar.insertBefore(tab, toolbar);

  const panel = document.createElement('div');
  panel.className = 'tab-panel';
  panel.id = 'panel-' + id;
  panel.innerHTML = '<article class="markdown-body">' + html + '</article>';
  panels.appendChild(panel);

  switchTab(id);
}

function updateTabContent(id, html) {
  var panel = document.getElementById('panel-' + id);
  if (panel) {
    panel.innerHTML = '<article class="markdown-body">' + html + '</article>';
  }
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.id == id);
  });
  document.querySelectorAll('.tab-panel').forEach(function(p) {
    p.classList.toggle('active', p.id === 'panel-' + id);
  });
  activeTabId = id;

  var tab = document.querySelector('.tab[data-id="' + id + '"]');
  if (tab) {
    var title = tab.querySelector('.tab-title').textContent;
    updateTitle(title);
  }
}

function switchTabByOffset(offset) {
  var tabs = Array.from(document.querySelectorAll('.tab'));
  if (tabs.length <= 1) return;
  var idx = tabs.findIndex(function(t) { return t.dataset.id == activeTabId; });
  if (idx === -1) return;
  var next = (idx + offset + tabs.length) % tabs.length;
  switchTab(parseInt(tabs[next].dataset.id));
}

function closeTab(id) {
  var tab = document.querySelector('.tab[data-id="' + id + '"]');
  var panel = document.getElementById('panel-' + id);

  if (activeTabId == id) {
    var tabs = Array.from(document.querySelectorAll('.tab'));
    var idx = tabs.indexOf(tab);
    var next = tabs[idx + 1] || tabs[idx - 1];
    if (next) { switchTab(parseInt(next.dataset.id)); }
  }

  if (tab) tab.remove();
  if (panel) panel.remove();

  if (document.querySelectorAll('.tab').length === 0) {
    closeViewer();
  }
}

/* Zoom */
var zoomLevel = 180;
var ZOOM_STEP = 10;
var ZOOM_MIN = 50;
var ZOOM_MAX = 300;

function applyZoom() {
  document.getElementById('tabPanels').style.zoom = (zoomLevel / 100);
  document.getElementById('zoomLabel').textContent = zoomLevel + '%';
}
function zoomIn()  { if (zoomLevel < ZOOM_MAX) { zoomLevel += ZOOM_STEP; applyZoom(); } }
function zoomOut() { if (zoomLevel > ZOOM_MIN) { zoomLevel -= ZOOM_STEP; applyZoom(); } }
function zoomReset() { zoomLevel = 180; applyZoom(); }

/* Theme */
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').innerHTML = theme === 'dark' ? '&#x2600;' : '&#x263e;';
  try { localStorage.setItem('md-viewer-theme', theme); } catch(e) {}
}
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'dark';
  setTheme(current === 'dark' ? 'light' : 'dark');
}
// Apply default theme (dark), override with saved preference if available
(function() {
  var theme = 'dark';
  try { var saved = localStorage.getItem('md-viewer-theme'); if (saved) theme = saved; } catch(e) {}
  setTheme(theme);
  applyZoom();
})();

/* Search */
var searchMatches = [];
var searchCurrentIdx = -1;

function openSearch() {
  var bar = document.getElementById('searchBar');
  bar.classList.add('visible');
  var input = document.getElementById('searchInput');
  input.focus();
  input.select();
}

function closeSearch() {
  document.getElementById('searchBar').classList.remove('visible');
  clearHighlights();
  searchMatches = [];
  searchCurrentIdx = -1;
  document.getElementById('searchCount').textContent = '';
  document.getElementById('searchInput').value = '';
}

function clearHighlights() {
  var panel = activeTabId != null ? document.getElementById('panel-' + activeTabId) : null;
  if (!panel) return;
  var marks = panel.querySelectorAll('mark.search-highlight');
  marks.forEach(function(m) {
    var parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
}

function performSearch(query) {
  clearHighlights();
  searchMatches = [];
  searchCurrentIdx = -1;
  var countEl = document.getElementById('searchCount');

  if (!query) { countEl.textContent = ''; return; }

  var panel = activeTabId != null ? document.getElementById('panel-' + activeTabId) : null;
  if (!panel) return;

  var treeWalker = document.createTreeWalker(panel, NodeFilter.SHOW_TEXT, null);
  var textNodes = [];
  while (treeWalker.nextNode()) textNodes.push(treeWalker.currentNode);

  var queryLower = query.toLowerCase();
  textNodes.forEach(function(node) {
    var text = node.textContent;
    var lower = text.toLowerCase();
    var idx = 0;
    var parts = [];
    var lastEnd = 0;
    while ((idx = lower.indexOf(queryLower, idx)) !== -1) {
      if (idx > lastEnd) parts.push({ text: text.substring(lastEnd, idx), match: false });
      parts.push({ text: text.substring(idx, idx + query.length), match: true });
      lastEnd = idx + query.length;
      idx = lastEnd;
    }
    if (parts.length === 0) return;
    if (lastEnd < text.length) parts.push({ text: text.substring(lastEnd), match: false });

    var frag = document.createDocumentFragment();
    parts.forEach(function(p) {
      if (p.match) {
        var mark = document.createElement('mark');
        mark.className = 'search-highlight';
        mark.textContent = p.text;
        frag.appendChild(mark);
        searchMatches.push(mark);
      } else {
        frag.appendChild(document.createTextNode(p.text));
      }
    });
    node.parentNode.replaceChild(frag, node);
  });

  if (searchMatches.length > 0) {
    searchCurrentIdx = 0;
    searchMatches[0].classList.add('current');
    searchMatches[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  countEl.textContent = searchMatches.length > 0 ? '1/' + searchMatches.length : 'No results';
}

function searchNext() {
  if (searchMatches.length === 0) return;
  searchMatches[searchCurrentIdx].classList.remove('current');
  searchCurrentIdx = (searchCurrentIdx + 1) % searchMatches.length;
  searchMatches[searchCurrentIdx].classList.add('current');
  searchMatches[searchCurrentIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('searchCount').textContent = (searchCurrentIdx + 1) + '/' + searchMatches.length;
}

function searchPrev() {
  if (searchMatches.length === 0) return;
  searchMatches[searchCurrentIdx].classList.remove('current');
  searchCurrentIdx = (searchCurrentIdx - 1 + searchMatches.length) % searchMatches.length;
  searchMatches[searchCurrentIdx].classList.add('current');
  searchMatches[searchCurrentIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('searchCount').textContent = (searchCurrentIdx + 1) + '/' + searchMatches.length;
}

document.getElementById('searchInput').addEventListener('input', function() {
  performSearch(this.value);
});

/* Quick index (Ctrl+Shift+A): live search over tabs & headings */
var qiItems = [];
var qiFiltered = [];
var qiSelected = 0;
var qiVisible = false;

function ensureHeadingIds() {
  var panels = document.querySelectorAll('.tab-panel');
  for (var p = 0; p < panels.length; p++) {
    var heads = panels[p].querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6');
    for (var i = 0; i < heads.length; i++) {
      if (!heads[i].id) heads[i].id = 'qi-h-' + p + '-' + i;
    }
  }
}

function buildIndex() {
  qiItems = [];
  var tabs = document.querySelectorAll('#tabBar .tab');
  for (var i = 0; i < tabs.length; i++) {
    var id = parseInt(tabs[i].dataset.id);
    qiItems.push({ tabId: id, tab: tabs[i].querySelector('.tab-title').textContent, text: '', headingId: null });
    var panel = document.getElementById('panel-' + id);
    if (panel) {
      var heads = panel.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6');
      for (var j = 0; j < heads.length; j++) {
        qiItems.push({ tabId: id, tab: tabs[i].querySelector('.tab-title').textContent, text: heads[j].textContent, headingId: heads[j].id || null });
      }
    }
  }
}

function renderQuickIndex() {
  var q = document.getElementById('quickIndexInput').value;
  var list = document.getElementById('quickIndexList');
  list.innerHTML = '';
  if (!q) {
    qiSelected = 0;
    var none = document.createElement('div');
    none.className = 'qi-empty';
    none.textContent = 'Type to search ' + qiItems.length + ' entries across all tabs…';
    list.appendChild(none);
    return;
  }
  var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  qiFiltered = [];
  for (var i = 0; i < qiItems.length; i++) {
    var item = qiItems[i];
    var score = 0, all = true;
    var haystack = item.text || item.tab;
    for (var t = 0; t < tokens.length; t++) {
      var idx = haystack.toLowerCase().indexOf(tokens[t]);
      if (idx !== -1) score += 40 - Math.min(idx, 39) + (idx === 0 ? 8 : 0);
      if (item.tab.toLowerCase().indexOf(tokens[t]) !== -1) score += 18;
      if (idx === -1) all = false;
    }
    if (all && score > 0) qiFiltered.push({ item: item, score: score });
  }
  qiFiltered.sort(function(a, b) { return b.score - a.score; });
  if (qiSelected >= qiFiltered.length) qiSelected = 0;
  var max = Math.min(qiFiltered.length, 200);
  for (var r = 0; r < max; r++) {
    (function(item, row) {
      var el = document.createElement('div');
      el.className = 'qi-item';
      if (row === qiSelected) el.classList.add('selected');

      var txt = document.createElement('span');
      txt.className = 'qi-text';
      if (item.text) txt.textContent = item.text;
      else txt.textContent = 'Open tab: ' + item.tab;

      var badge = document.createElement('span');
      badge.className = 'qi-badge';
      badge.textContent = item.tab;
      el.appendChild(txt);
      el.appendChild(badge);

      el.onclick = function() { selectQuickIndexItem(item); };
      el.onmouseenter = function() { qiSelected = row; refreshQuickSelection(); };
      list.appendChild(el);
    })(qiFiltered[r].item, r);
  }
  if (qiFiltered.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'qi-empty';
    empty.textContent = 'No matches';
    list.appendChild(empty);
  }
}

function refreshQuickSelection() {
  var items = document.querySelectorAll('#quickIndexList .qi-item');
  items.forEach(function(el, i) {
    el.classList.toggle('selected', i === qiSelected);
    if (i === qiSelected) el.scrollIntoView({ block: 'nearest' });
  });
}

function selectQuickIndexItem(item) {
  switchTab(item.tabId);
  if (item.headingId) {
    var headingId = item.headingId;
    setTimeout(function() {
      // Scope to the target panel: goldmark generates the same id for
      // same-named headings in different files.
      var h = document.querySelector('#panel-' + item.tabId + ' #' + headingId) ||
              document.getElementById(headingId);
      if (h) {
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        h.classList.remove('qi-flash');
        void h.offsetWidth;
        h.classList.add('qi-flash');
      }
    }, 60);
  }
  closeQuickIndex();
}

function openQuickIndex() {
  if (document.getElementById('searchBar').classList.contains('visible')) closeSearch();
  ensureHeadingIds();
  buildIndex();
  qiSelected = 0;
  qiVisible = true;
  document.getElementById('quickIndex').classList.add('visible');
  var input = document.getElementById('quickIndexInput');
  input.value = '';
  input.focus();
  renderQuickIndex();
}

function closeQuickIndex() {
  qiVisible = false;
  document.getElementById('quickIndex').classList.remove('visible');
}

document.getElementById('quickIndexInput').addEventListener('input', function() {
  qiSelected = 0;
  renderQuickIndex();
});

document.getElementById('quickIndexInput').addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    var items = document.querySelectorAll('#quickIndexList .qi-item');
    if (items.length > 0) { qiSelected = Math.min(qiSelected + 1, items.length - 1); refreshQuickSelection(); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (qiSelected > 0) { qiSelected--; refreshQuickSelection(); }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (qiFiltered.length > 0) selectQuickIndexItem(qiFiltered[Math.min(qiSelected, qiFiltered.length - 1)].item);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closeQuickIndex();
  }
  // Let Ctrl+Shift+A and Ctrl+F reach the global handler while typing
  if (e.ctrlKey && !e.altKey && !e.metaKey) {
    if (e.shiftKey && (e.key === 'A' || e.key === 'a')) return;
    if (e.key === 'f' || e.key === 'F') return;
  }
  e.stopPropagation();
});

/* Keyboard shortcuts */
document.addEventListener('keydown', function(e) {
  var searchVisible = document.getElementById('searchBar').classList.contains('visible');

  if (e.key === '/' && !searchVisible && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    openSearch();
    return;
  }
  if (e.key === 'Escape' && searchVisible) {
    e.preventDefault();
    closeSearch();
    return;
  }
  if (e.key === 'F3' && searchVisible) {
    e.preventDefault();
    if (e.shiftKey) searchPrev(); else searchNext();
    return;
  }

  if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
    e.preventDefault();
    openQuickIndex();
    return;
  }
  if (e.ctrlKey && (e.key === 'f' || e.key === 'F')) {
    e.preventDefault();
    if (qiVisible) closeQuickIndex();
    openSearch();
    return;
  }

  if (e.ctrlKey && e.key === 'Tab') {
    e.preventDefault();
    switchTabByOffset(e.shiftKey ? -1 : 1);
    return;
  }
  if (e.ctrlKey && e.key === 'PageDown') { e.preventDefault(); switchTabByOffset(1); return; }
  if (e.ctrlKey && e.key === 'PageUp') { e.preventDefault(); switchTabByOffset(-1); return; }
  if (e.ctrlKey && e.key === 'w') { e.preventDefault(); if (activeTabId != null) closeTab(activeTabId); return; }

  if (e.ctrlKey && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomIn(); }
  else if (e.ctrlKey && e.key === '-') { e.preventDefault(); zoomOut(); }
  else if (e.ctrlKey && e.key === '0') { e.preventDefault(); zoomReset(); }
  else if (e.ctrlKey && e.shiftKey && e.key === 'L') { e.preventDefault(); toggleTheme(); }
});

/* Multiple initial tabs (injected before page load) */
function initTabs(tabs) {
  tabs.forEach(function(t) { addTab(t[0], t[1], t[2]); });
}

/* INITIAL_TAB */
