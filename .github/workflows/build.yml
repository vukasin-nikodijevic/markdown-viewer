name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # webview needs CGO, so each target builds on its own native runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: amd64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Current Go, not go.mod's 1.22: Go 1.22's linker leaves macOS binaries
      # with an invalid code signature, so they're killed on launch
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install GTK and WebKitGTK
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: make

      - name: Test
        run: go test ./...

      - name: Smoke test binary
        run: |
          if [[ "${{ matrix.os }}" == darwin ]]; then codesign --verify md-viewer; fi
          status=0
          out=$(./md-viewer 2>&1) || status=$?
          echo "$out"
          [[ $status -eq 1 && "$out" == Usage* ]]

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="${GITHUB_SHA::7}"
          name="md-viewer_${version}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir "$name"
          cp md-viewer LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
